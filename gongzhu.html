<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183b35"><meta name="apple-mobile-web-app-capable" content="yes"><title>誰羽橋豬社｜拱豬計分板</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#20322e;background:#f3f6f3}*{box-sizing:border-box}body{margin:0;padding:12px 10px 80px}main{max-width:900px;margin:auto}header{background:#183b35;color:white;border-radius:16px;padding:16px}h1{font-size:23px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}.sub{opacity:.8;font-size:13px}.card{background:white;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 8px #1232}label{font-size:13px}input,select,button{font:inherit;border:1px solid #cbd8d2;border-radius:9px;padding:10px;min-width:0}input[type=number]{width:100%;text-align:center;font-size:16px}input.name{width:100%;font-size:13px;padding:8px 3px;text-align:center}button{cursor:pointer;background:#e8efec}button.primary{background:#176a51;color:white;border:0;font-weight:700}button.danger{color:#9e2b26}button:disabled{opacity:.45}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.settings input,.settings select{width:100%;margin-top:5px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13px}th,td{border-bottom:1px solid #e5ebe8;padding:6px 3px;text-align:center}th:first-child,td:first-child{width:67px;text-align:left;font-weight:700}td input{padding:8px 1px;border-radius:6px}.red{color:#c62938}.black{color:#222}.total{background:#e7f3ec;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:110px}.note{font-size:12px;color:#667a70;line-height:1.6}.status{font-size:14px;font-weight:700;color:#176a51;margin-top:9px}.history th:first-child,.history td:first-child{width:70px}.history .reset{background:#fff4dd}.history .snapshot{background:#eef3ff}.history .last{background:#dff0e6;font-weight:700}.history td{font-variant-numeric:tabular-nums}.small{font-size:12px}.link{word-break:break-all}#archiveList button{font-size:12px;margin:3px} @media(max-width:500px){body{padding:8px 5px 60px}.card{padding:10px}th:first-child,td:first-child{width:53px}table{font-size:12px}td input{font-size:15px;padding:7px 0}.history th:first-child,.history td:first-child{width:56px}}</style></head><body><main><header><h1>♠ ♥ ♦ ♣ 拱豬計分板</h1><div class="sub">誰羽橋豬社・手機版</div></header><section class="card"><h2>比賽設定</h2><div class="settings"><label>遊戲人數<select id="count"><option>4</option><option>5</option><option>6</option><option>7</option></select></label><label>正負分門檻<input id="threshold" type="number" inputmode="numeric" min="1" step="1" value="1001"></label></div><p class="note">最多30局。累計恰好等於負門檻，自動歸零；超過正負門檻，比賽結束。</p><div id="status" class="status"></div></section><section class="card"><h2 id="roundTitle">第1局｜輸入吃到的牌</h2><div class="scroll"><table id="entry"></table></div><div class="actions"><button class="primary" id="saveRound">記錄本局</button><button id="clearEntry">清空本局</button><button id="undo">撤銷上一局</button></div><p class="note">紅心直接輸入分數；♠Q、♦J、♣10輸入張數。空白=0。梅花10有1或2張時，有其他計分牌皆乘2；只有梅花10，每張+50。</p></section><section class="card"><h2>歷史紀錄</h2><div class="scroll"><table id="history" class="history"></table></div><div class="actions"><button id="export">下載成績檔</button><button id="share">分享成績</button><button id="archive">儲存本機歷史</button><button class="danger" id="restart">重新開賽</button></div><p class="note">每局自動儲存在這支手機。下載或分享可保留完整成績。公開網站同步需另接雲端資料庫，目前尚未啟用。</p></section><section class="card"><h2>本機歷史比賽</h2><div id="archiveList" class="small"></div></section></main><script>
'use strict';const KEY='gongzhu-v1',ARCH='gongzhu-archive-v1';const $=id=>document.getElementById(id);const fresh=()=>({count:4,threshold:1001,names:Array.from({length:7},(_,i)=>'玩家'+(i+1)),rounds:[],draft:Array.from({length:7},()=>['','','','']),finished:false});let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()}if(!state.draft)state.draft=fresh().draft;const counts={4:[1,1,1],5:[1,1,2],6:[2,2,1],7:[2,2,2]};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function val(x){return x===''?0:Number(x)}function score(d){const [h,q,j,c]=d.map(val),base=h-100*q+100*j;return c>0?(h===0&&q===0&&j===0?50*c:2*base):base}function evaluate(){let totals=Array(state.count).fill(0),rows=[],ended=false,reason='';const T=state.threshold;for(let r=0;r<state.rounds.length;r++){const points=state.rounds[r].map(score);totals=totals.map((v,i)=>v+points[i]);rows.push({label:'第'+(r+1)+'局',values:points,type:'round'});const reset=totals.some(x=>x===-T);if(reset){rows.push({label:'累計',values:[...totals],type:'snapshot'});totals=totals.map(x=>x===-T?0:x);rows.push({label:'歸零後',values:[...totals],type:'reset'})}if(totals.some(x=>x>T||x< -T)){ended=true;reason='分數超過 ±'+T;break}}if(state.rounds.length>=30){ended=true;reason='已達30局'}return{totals,rows,ended,reason}}function renderEntry(){let html='<tr><th>項目</th>';for(let i=0;i<state.count;i++)html+=`<th><input class="name" data-name="${i}" aria-label="玩家${i+1}姓名" value="${esc(state.names[i])}"></th>`;html+='</tr>';const labels=['<span class="red">♥ 紅心</span>','<span class="black">♠ Q</span>','<span class="red">♦ J</span>','<span class="black">♣ 10</span>'];for(let k=0;k<4;k++){html+=`<tr><td>${labels[k]}</td>`;for(let i=0;i<state.count;i++)html+=`<td><input type="number" inputmode="numeric" step="1" ${k?'min="0" max="'+counts[state.count][k-1]+'"':''} data-player="${i}" data-kind="${k}" aria-label="${esc(state.names[i])} ${['紅心','黑桃Q','方塊J','梅花10'][k]}" value="${esc(state.draft[i][k])}" ${state.finished?'disabled':''}></td>`;html+='</tr>'}html+='<tr class="total"><td>合計</td>';for(let i=0;i<state.count;i++)html+=`<td id="s${i}">${score(state.draft[i])}</td>`;html+='</tr>';$('entry').innerHTML=html;document.querySelectorAll('[data-name]').forEach(e=>e.addEventListener('change',()=>{state.names[+e.dataset.name]=e.value.trim()||'玩家'+(+e.dataset.name+1);persist();renderHistory()}));document.querySelectorAll('[data-player]').forEach(e=>e.addEventListener('input',()=>{state.draft[+e.dataset.player][+e.dataset.kind]=e.value;persist();for(let i=0;i<state.count;i++)$('s'+i).textContent=score(state.draft[i])}));}function renderHistory(){const ev=evaluate();let html='<tr><th>局數</th>'+state.names.slice(0,state.count).map(n=>`<th>${esc(n)}</th>`).join('')+'</tr>';for(const r of ev.rows)html+=`<tr class="${r.type}"><td>${r.label}</td>${r.values.map(v=>`<td>${v}</td>`).join('')}</tr>`;html+=`<tr class="last"><td>總累計</td>${ev.totals.map(v=>`<td>${v}</td>`).join('')}</tr>`;$('history').innerHTML=html;$('roundTitle').textContent=`第${Math.min(31,state.rounds.length+1)}局｜輸入吃到的牌`;$('status').textContent=ev.ended?'比賽結束：'+ev.reason:`已記錄 ${state.rounds.length}/30 局`;state.finished=ev.ended;$('saveRound').disabled=ev.ended;$('undo').disabled=!state.rounds.length;return ev}function render(){ $('count').value=state.count;$('threshold').value=state.threshold;renderEntry();renderHistory();renderArchives();persist()}function validate(){const limits=counts[state.count];for(let k=0;k<3;k++){let sum=0;for(let i=0;i<state.count;i++){const x=state.draft[i][k+1];if(x!==''&&(!Number.isInteger(Number(x))||Number(x)<0))return '特殊牌張數必須是非負整數';sum+=val(x)}if(sum>limits[k])return ['黑桃Q','方塊J','梅花10'][k]+'總張數不能超過'+limits[k]}for(let i=0;i<state.count;i++){const h=state.draft[i][0];if(h!==''&&!Number.isInteger(Number(h)))return '紅心分數請輸入整數'}return ''}function saveRound(){const error=validate();if(error)return alert(error);if(!confirm('確認記錄第'+(state.rounds.length+1)+'局？'))return;state.rounds.push(state.draft.slice(0,state.count).map(d=>[...d]));state.draft=fresh().draft;render();if(state.finished)alert('比賽結束！可下載或分享完整成績。')}function csv(){const ev=evaluate(),lines=[['局數',...state.names.slice(0,state.count)],...ev.rows.map(r=>[r.label,...r.values]),['總累計',...ev.totals]];return '\ufeff'+lines.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n')}function filename(){return '拱豬成績_'+new Date().toISOString().slice(0,10)+'.csv'}function download(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv()],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=filename();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function archives(){try{return JSON.parse(localStorage.getItem(ARCH))||[]}catch{return []}}function renderArchives(){const arr=archives();$('archiveList').innerHTML=arr.length?arr.map((a,i)=>`<div><button data-open="${i}">${esc(a.date)}｜${a.data.rounds.length}局｜${esc(a.data.names.slice(0,a.data.count).join('、'))}</button></div>`).join(''):'尚無已儲存的歷史比賽';document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{if(!confirm('載入此場比賽？目前計分進度會被取代，請先儲存。'))return;state=structuredClone(archives()[+e.dataset.open].data);render()})}$('count').onchange=e=>{if(state.rounds.length&&!confirm('更改人數會清空目前比賽紀錄，確定嗎？')){e.target.value=state.count;return}state=fresh();state.count=Number(e.target.value);render()};$('threshold').onchange=e=>{const n=Number(e.target.value);if(!Number.isInteger(n)||n<1){alert('門檻必須是正整數');e.target.value=state.threshold;return}state.threshold=n;render()};$('saveRound').onclick=saveRound;$('clearEntry').onclick=()=>{state.draft=fresh().draft;render()};$('undo').onclick=()=>{if(!state.rounds.length||!confirm('確定撤銷最後一局？'))return;state.draft=state.rounds.pop().map(x=>[...x]);render()};$('export').onclick=download;$('share').onclick=async()=>{const file=new File([csv()],filename(),{type:'text/csv'});try{if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'拱豬成績'});else if(navigator.share)await navigator.share({title:'拱豬成績',text:csv()});else download()}catch(e){if(e.name!=='AbortError')alert('分享失敗，請使用下載成績檔')}};$('archive').onclick=()=>{const arr=archives();arr.unshift({date:new Date().toLocaleString('zh-TW'),data:structuredClone(state)});localStorage.setItem(ARCH,JSON.stringify(arr));renderArchives();alert('已儲存在本機歷史比賽')};$('restart').onclick=()=>{if(!confirm('重新開賽會清除目前比賽進度。建議先儲存本機歷史，確定繼續？'))return;const n=state.count,t=state.threshold;state=fresh();state.count=n;state.threshold=t;render()};render();
</script></body></html>
